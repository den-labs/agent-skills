name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # validate-skills.sh delegates frontmatter checking to the official
      # skills-ref validator, which it runs through npx.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      # skills-ref validates only its first path argument and silently ignores
      # the rest, so each skill must be a separate invocation.
      - name: Validate against the Agent Skills spec
        run: |
          for skill in skills/*/; do
            [ -f "$skill/SKILL.md" ] || continue
            npx --yes skills-ref@latest validate "$skill"
          done

      - name: Validate skill structure
        run: ./scripts/validate-skills.sh

      - name: Check the shared library has not drifted
        run: ./scripts/sync-shared.sh --check

  safety:
    name: On-chain script safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # `cast` is stubbed inside the suite, so this never reaches a real chain.
      - name: Run safety tests
        run: ./tests/test-safety.sh

  reads:
    name: On-chain read path
    runs-on: ubuntu-latest
    # Hits public RPC endpoints, so a failure is informational.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Read agents from live chains without Foundry
        run: ./tests/test-reads.sh

  links:
    name: External links
    runs-on: ubuntu-latest
    # Third-party sites go down independently of this repo.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Check external links resolve
        run: ./scripts/check-links.sh

  addresses:
    name: Verify registry addresses on-chain
    runs-on: ubuntu-latest
    # Depends on public RPC endpoints, so a failure here is informational:
    # it means an address needs re-checking, not that the PR is broken.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Check each documented registry has code deployed
        run: ./scripts/verify-addresses.sh
